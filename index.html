<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="description" content="简单记下每一笔日常支出">
  <title>轻记 · 日常支出</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2336523e'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='42' fill='white'%3E记%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./core.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="brand"><span class="brand-icon">记</span><span>轻记</span><span class="brand-dot" aria-hidden="true"></span></header>
    <main id="app"></main>
    <nav aria-label="主导航" id="nav">
      <button type="button" data-page="record"><span aria-hidden="true">＋</span>记账</button>
      <button type="button" data-page="history"><span aria-hidden="true">≡</span>明细</button>
      <button type="button" data-page="settings"><span aria-hidden="true">⚙</span>设置</button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="backfill" aria-labelledby="backfill-title"></dialog>
  <noscript>请启用 JavaScript 以使用本地记账。</noscript>
</body>
</html>
